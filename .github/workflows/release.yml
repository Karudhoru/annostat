name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        default: "v1.0.2"
      publish_pypi:
        description: "Publish distributions to PyPI"
        required: true
        type: boolean
        default: true
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release tests
        run: |
          python -m compileall -q annostat tests
          python -m unittest discover -v
      - name: Build and verify distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python -c "import os, re, tomllib; tag=os.environ['RELEASE_TAG']; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), f'invalid release tag: {tag}'; assert tag == f'v{version}', f'{tag} does not match package version {version}'"
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/annostat/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  attach-artifacts:
    name: Attach distributions to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}"
          dist/*
          --repo "${{ github.repository }}"
          --clobber
