[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annostat"
version = "0.5.0"
description = "Analyze bacterial genome annotations from GFF3 and FASTA files"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
annostat = "annostat.cli:main"

[tool.setuptools.packages.find]
include = ["annostat*"]
