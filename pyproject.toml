[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annostat"
version = "1.0.0"
description = "Analyze bacterial genome annotations from GFF3 and FASTA files"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["bioinformatics", "genome-annotation", "gff3", "fasta", "quality-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/Karudhoru/annostat"
Issues = "https://github.com/Karudhoru/annostat/issues"

[project.scripts]
annostat = "annostat.cli:main"

[tool.setuptools.packages.find]
include = ["annostat*"]
